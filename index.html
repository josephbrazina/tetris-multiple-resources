<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dual-task performance experiment</title>
<style>
:root{--bg:#292d33;--panel:#363c45;--text:#f2f4f7;--muted:#b8c0ca;--accent:#6ea8fe;--line:#56606c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:6px;padding:10px 16px;background:var(--accent);color:#08111f;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}main{max-width:1100px;margin:0 auto;padding:28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 8px 25px #0002}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700}.field small,.hint{color:var(--muted);font-weight:400;font-size:13px}.field input,.field select{background:#252a31;border:1px solid #687483;border-radius:5px;color:var(--text);padding:9px}.wide{grid-column:1/-1}.status{margin:12px 0;padding:10px;border-radius:6px;background:#f0f2f5;color:#18202b;min-height:40px}.status.ok{background:#d8f7e3}.status.bad{background:#ffe0e0}.status.info{background:#e1edff}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.right{margin-left:auto}.experiment{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center}.task-layout{display:grid;grid-template-columns:360px 1fr;gap:40px;align-items:center;width:min(100%,1050px)}.solo{display:flex;justify-content:center}.task-side,.task-main{min-height:520px;display:flex;align-items:center;justify-content:center}.task-side{background:#252a31;border:1px solid var(--line);border-radius:8px}.tetris-wrap{display:flex;gap:18px;align-items:flex-start}.board-wrap{display:flex;flex-direction:column;align-items:center}.board{display:block;background:#0b0e12;border:3px solid #7d8997;image-rendering:pixelated}.next{width:120px}.nextbox{display:block;width:120px;height:120px;background:#0b0e12;border:2px solid #687483;margin-top:8px;image-rendering:pixelated}.kbd{display:inline-block;border:1px solid #8b98a8;border-bottom-width:3px;border-radius:5px;padding:2px 9px;margin:2px}.big{font-size:34px}.progress{height:8px;background:#1e2329;border-radius:4px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0}.summary table{border-collapse:collapse;width:100%;font-size:13px}.summary th,.summary td{border:1px solid var(--line);padding:7px;text-align:left}.summary th{background:#252a31}.errorbox{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;background:#221b1b;padding:10px;border-radius:5px;color:#ffd0d0}.secondary{text-align:center;width:100%}.secondary canvas{background:#20252b;border:1px solid var(--line);border-radius:8px}.statusline{min-height:24px;color:var(--muted)}@media(max-width:800px){main{padding:14px}.grid,.task-layout{grid-template-columns:1fr}.task-layout{gap:12px}.board{width:250px;height:500px}.task-side,.task-main{min-height:400px}}
</style>
</head>
<body>
<main id="app">
<section id="setup" class="panel"><h1>Dual-task performance experiment</h1><p class="hint">Wickens' multiple resource theory: Tetris with visual-spatial mental rotation or auditory-verbal phoneme discrimination.</p><div class="grid">
<div class="field"><label for="pid">Participant ID <small>required</small></label><input id="pid" autocomplete="off"></div><div class="field"><label for="order">Block order</label><select id="order"><option value="latin">Counterbalanced Latin square</option><option value="singlefirst">Single tasks first, then dual tasks</option><option value="random">Fully random</option><option value="fixed">Fixed order</option></select></div>
<div class="field"><label for="blockSec">Block length, seconds</label><input id="blockSec" type="number" value="180" min="1"></div><div class="field"><label for="practiceSec">Practice length per task, seconds <small>0 = no practice</small></label><input id="practiceSec" type="number" value="90" min="0"></div><div class="field"><label for="speed">Tetris speed, ms per row <small>300–1000</small></label><input id="speed" type="number" value="650" min="300" max="1000"></div><div class="field"><label for="calibrate">Calibrate Tetris speed during practice</label><select id="calibrate"><option value="yes">Yes</option><option value="no">No</option></select></div><div class="field"><label for="mrWindow">Mental rotation response window, seconds</label><input id="mrWindow" type="number" value="6" min="1"></div><div class="field"><label for="phWindow">Phoneme response window, seconds</label><input id="phWindow" type="number" value="2" min=".2" step=".1"></div><div class="field"><label for="stepDiff">Phoneme step difference in main blocks</label><select id="stepDiff"><option>2</option><option selected>3</option><option>4</option></select></div><div class="field"><label for="practiceAcc">Practice accuracy needed to move on</label><input id="practiceAcc" type="number" value="75" min="1" max="100">%</div><div class="field"><label for="maxAttempts">Maximum practice attempts per task</label><input id="maxAttempts" type="number" value="3" min="1" max="10"></div><div class="wide"><div id="trialInfo" class="status info"></div></div><div class="wide"><div id="audioStatus" class="status info">Loading audio files…</div><div id="audioDetails" class="hint"></div></div><div class="wide row"><button id="start" disabled>Start experiment</button><span class="hint">All seven WAV files must load before the experiment can start.</span></div></div></section>
<section id="exp" class="experiment hidden"><div id="expContent" class="panel" style="width:100%"></div></section><section id="done" class="panel hidden"><h1>Experiment complete</h1><div id="finalSummary"></div><button id="download">Download CSV</button></section>
</main>
<script>
'use strict';const $=id=>document.getElementById(id),audioNames=Array.from({length:7},(_,i)=>`step${i+1}.wav`),audioEls=[];let audioReady=false,settings={},rows=[],order=[],blockIndex=0,blockTimer=null,blockStart=0,currentCondition='',activeTetris=null,secondaryCleanup=null;const conditions=['tetris','mental','phoneme','tetris+mental','tetris+phoneme'];const colors={I:'#39c5ff',J:'#4e7cff',L:'#ff9f43',O:'#ffd447',S:'#57d68d',T:'#b27cff',Z:'#ff5c6c'},pieces={I:[[0,1],[1,1],[2,1],[3,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]],O:[[1,0],[2,0],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],T:[[1,0],[0,1],[1,1],[2,1]],Z:[[0,0],[1,0],[1,1],[2,1]]};function assetUrl(n){return new URL(`stimuli/${n}`,document.baseURI).href}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function audioStatus(t,k='info'){$('audioStatus').textContent=t;$('audioStatus').className=`status ${k}`}function loadOne(name,i){return new Promise((resolve,reject)=>{const a=new Audio();a.preload='auto';const url=assetUrl(name);let done=false;const finish=(ok,msg='')=>{if(done)return;done=true;clearTimeout(timer);['canplaythrough','loadeddata','error'].forEach(ev=>a.removeEventListener(ev,handler));if(ok){audioEls[i]=a;resolve(a)}else reject(new Error(`${name}: ${msg||'could not decode'}\nURL: ${url}`))};const handler=e=>e.type==='error'?finish(false,a.error?`media error ${a.error.code}`:'load error'):finish(true);const timer=setTimeout(()=>finish(false,'timed out after 15 seconds'),15000);['canplaythrough','loadeddata','error'].forEach(ev=>a.addEventListener(ev,handler));a.src=url;a.load()})}async function loadAudio(){for(let i=0;i<audioNames.length;i++){const n=audioNames[i];audioStatus(`Loading ${i+1}/7: ${n}…`);$('audioDetails').textContent=assetUrl(n);try{await loadOne(n,i)}catch(e){audioStatus('Audio loading failed','bad');$('audioDetails').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`;return}}audioReady=true;audioStatus('All 7 WAV files loaded successfully','ok');$('audioDetails').textContent='The Start button is enabled.';$('start').disabled=false}function updateInfo(){const b=Math.max(1,+$('blockSec').value||180);$('trialInfo').textContent=`Phoneme: ${Math.floor(b/3)} pairs, one every 3 s. Mental rotation: ${Math.floor(b/6)} trials, one every 6 s.`}$('blockSec').addEventListener('input',updateInfo);updateInfo();loadAudio();function readSettings(){settings={pid:$('pid').value.trim(),order:$('order').value,blockSec:+$('blockSec').value,practiceSec:+$('practiceSec').value,speed:+$('speed').value,calibrate:$('calibrate').value==='yes',mrWindow:+$('mrWindow').value,phWindow:+$('phWindow').value,stepDiff:+$('stepDiff').value,practiceAcc:+$('practiceAcc').value,maxAttempts:+$('maxAttempts').value}}function valid(){readSettings();if(!settings.pid){alert('Enter a participant ID.');$('pid').focus();return false}if(settings.order==='latin'&&!/[0-9]/.test(settings.pid)){alert('Counterbalanced order requires a participant ID containing a number.');$('pid').focus();return false}if(!audioReady){audioStatus('Cannot start: all seven WAV files are not loaded','bad');return false}if(settings.speed<300||settings.speed>1000||settings.blockSec<=0)return false;return true}$('start').addEventListener('click',()=>{if(!valid())return;$('setup').classList.add('hidden');$('exp').classList.remove('hidden');order=makeOrder();blockIndex=0;runNextBlock()});function makeOrder(){let a=conditions.slice();if(settings.order==='random')return a.sort(()=>Math.random()-.5);if(settings.order==='latin'){const n=(parseInt((settings.pid.match(/\d+/)||['1'])[0],10)-1)%5;return a.slice(n).concat(a.slice(0,n))}return a}function label(c){return {tetris:'Tetris only',mental:'Mental rotation only',phoneme:'Phoneme discrimination only','tetris+mental':'Tetris + mental rotation','tetris+phoneme':'Tetris + phoneme discrimination'}[c]}function instructions(c){return c.includes('mental')?'Press S when the objects are the same and D when the right object is a mirror image.':c.includes('phoneme')?'Press S for same and D for different.':'Use ←/→ to move, ↑ to rotate, ↓ to move down one row, and SPACE to hard-drop.'}function runNextBlock(){if(blockIndex>=order.length){finish();return}currentCondition=order[blockIndex];blockIndex++;blockStart=performance.now();$('expContent').innerHTML=`<div class="row"><h2>${label(currentCondition)}</h2><span class="right" id="clock"></span></div><div class="progress"><i id="bar"></i></div><div id="task" class="task-main"></div><p class="hint">${instructions(currentCondition)}</p>`;activeTetris=null;secondaryCleanup?.();secondaryCleanup=null;const task=$('task');if(currentCondition==='tetris')startTetris(task);else if(currentCondition==='mental')startMental(task);else if(currentCondition==='phoneme')startPhoneme(task);else{task.className='task-layout';task.innerHTML='<div class="task-side" id="secondary"></div><div class="task-main" id="primary"></div>';if(currentCondition==='tetris+mental')startMental($('secondary'));else startPhoneme($('secondary'));startTetris($('primary'))}blockTimer=setInterval(updateBlock,50)}function updateBlock(){const elapsed=(performance.now()-blockStart)/1000,left=Math.max(0,settings.blockSec-elapsed);$('clock').textContent=`${left.toFixed(1)} s`;$('bar').style.width=`${Math.min(100,elapsed/settings.blockSec*100)}%`;if(left<=0){clearInterval(blockTimer);activeTetris?.stop();secondaryCleanup?.();rows.push({type:'summary',practice:false,block:blockIndex,condition:currentCondition,duration:settings.blockSec});runNextBlock()}}function startTetris(el){el.className='task-main solo';el.innerHTML='<div class="tetris-wrap"><div class="board-wrap"><canvas id="tetrisCanvas" class="board" width="250" height="500" tabindex="0"></canvas><p class="hint">←/→ move · ↑ rotate · ↓ down one row · SPACE hard-drop</p><div id="tetrisMsg" class="statusline"></div></div><div class="next"><b>Next piece</b><canvas id="nextCanvas" class="nextbox" width="120" height="120"></canvas></div></div>';activeTetris=new TetrisGame($('tetrisCanvas'),$('nextCanvas'),settings.speed);activeTetris.start();$('tetrisCanvas').focus()}class TetrisGame{constructor(canvas,next,speed){this.c=canvas;this.n=next;this.ctx=canvas.getContext('2d');this.nctx=next.getContext('2d');this.speed=speed;this.board=Array.from({length:20},()=>Array(10).fill(null));this.bag=[];this.current=null;this.nextPiece=null;this.x=0;this.y=0;this.last=performance.now();this.running=false;this.stopped=false;this.pieceStart=0;this.lastAction=performance.now();this.lines=0;this.spawnNext()}refill(){this.bag=['I','J','L','O','S','T','Z'].sort(()=>Math.random()-.5)}take(){if(!this.bag.length)this.refill();return this.bag.pop()}spawnNext(){this.current=this.nextPiece||this.take();this.nextPiece=this.take();this.shape=pieces[this.current].map(p=>p.slice());this.x=Math.floor((10-4)/2);this.y=0;this.pieceStart=performance.now();this.lastAction=performance.now();this.drawNext();if(this.collides(this.shape,this.x,this.y)){rows.push({type:'game_over',practice:false,block:blockIndex});this.board=Array.from({length:20},()=>Array(10).fill(null));this.spawnNext()}}start(){this.running=true;this.loop(performance.now())}stop(){this.running=false;this.stopped=true}loop(now){if(!this.running)return;if(now-this.last>=this.speed){this.last=now;if(!this.move(0,1))this.lock()}this.draw();requestAnimationFrame(t=>this.loop(t))}cells(shape=this.shape,x=this.x,y=this.y){return shape.map(([a,b])=>[x+a,y+b])}collides(shape,x,y){return this.cells(shape,x,y).some(([cx,cy])=>cx<0||cx>=10||cy>=20||(cy>=0&&this.board[cy][cx]))}move(dx,dy){if(this.collides(this.shape,this.x+dx,this.y+dy))return false;this.x+=dx;this.y+=dy;this.action();return true}rotate(){const rotated=this.shape.map(([x,y])=>[-y,x]);const minX=Math.min(...rotated.map(p=>p[0])),minY=Math.min(...rotated.map(p=>p[1]));const normalized=rotated.map(([x,y])=>[x-minX,y-minY]);for(const kick of [0,-1,1,-2,2])if(!this.collides(normalized,this.x+kick,this.y)){this.shape=normalized;this.x+=kick;this.action();return true}return false}hardDrop(){let d=0;while(this.move(0,1))d++;this.action(true);this.lock(true);return d}action(hard=false){this.lastAction=performance.now();rows.push({type:'tetris_piece_action',practice:false,block:blockIndex,piece:this.current,action:hard?'hard_drop':'move',x:this.x,y:this.y,time:this.lastAction})}lock(hard=false){for(const [x,y] of this.cells())if(y>=0)this.board[y][x]=this.current;const linesBefore=this.lines;for(let y=19;y>=0;y--)if(this.board[y].every(Boolean)){this.board.splice(y,1);this.board.unshift(Array(10).fill(null));this.lines++;y++}this.measurePiece(linesBefore,hard);this.spawnNext()}measurePiece(linesBefore,hard){let top=20;for(let y=0;y<20;y++)if(this.board[y].some(Boolean)){top=y;break}this.height=20-top;let holes=0;for(let x=0;x<10;x++){let seen=false;for(let y=0;y<20;y++){if(this.board[y][x])seen=true;else if(seen)holes++}}this.holes=holes;rows.push({type:'tetris_piece',practice:false,block:blockIndex,piece:this.current,placement_ms:Math.round(performance.now()-this.pieceStart),hard_drop:hard,lines_cleared:this.lines-linesBefore,holes:this.holes,stack_height:this.height})}draw(){const s=25;this.ctx.clearRect(0,0,250,500);this.ctx.fillStyle='#0b0e12';this.ctx.fillRect(0,0,250,500);for(let y=0;y<20;y++)for(let x=0;x<10;x++){this.ctx.strokeStyle='#252b33';this.ctx.strokeRect(x*s,y*s,s,s);if(this.board[y][x])this.cell(this.ctx,x,y,this.board[y][x],s)}for(const [x,y] of this.cells())if(y>=0)this.cell(this.ctx,x,y,this.current,s)}cell(ctx,x,y,type,s){ctx.fillStyle=colors[type];ctx.fillRect(x*s+1,y*s+1,s-2,s-2);ctx.strokeStyle='#101318';ctx.lineWidth=2;ctx.strokeRect(x*s+2,y*s+2,s-4,s-4)}drawNext(){const ctx=this.nctx,s=25;ctx.clearRect(0,0,120,120);ctx.fillStyle='#0b0e12';ctx.fillRect(0,0,120,120);const sh=pieces[this.nextPiece],ox=(4-Math.max(...sh.map(p=>p[0]))-1)*s/2,oy=(4-Math.max(...sh.map(p=>p[1]))-1)*s/2;sh.forEach(([x,y])=>this.cell(ctx,x+ox/s,y+oy/s,this.nextPiece,s))}}
function startMental(el){el.className='task-main solo';el.innerHTML='<div class="secondary"><canvas id="mrCanvas" width="700" height="380"></canvas><p class="big"><span class="kbd">S</span> same &nbsp; <span class="kbd">D</span> mirror</p><div id="mrMsg" class="statusline"></div></div>';drawMental();const key=e=>{if(!['s','d'].includes(e.key.toLowerCase()))return;rows.push({type:'mental_rotation',practice:false,block:blockIndex,response:e.key.toLowerCase(),rt_ms:0});drawMental()};document.addEventListener('keydown',key);secondaryCleanup=()=>document.removeEventListener('keydown',key)}function drawMental(){const c=$('mrCanvas');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#20252b';x.fillRect(0,0,c.width,c.height);for(const cx of [180,520]){x.strokeStyle='#111';x.lineWidth=4;x.fillStyle='#6ea8fe';for(let i=0;i<5;i++){const px=cx+(i%3-1)*42,py=180+Math.floor(i/3)*42;x.fillRect(px,py,38,38);x.strokeRect(px,py,38,38)}}}
function startPhoneme(el){el.className='task-main solo';el.innerHTML='<div class="secondary"><div class="big">Listen, then respond</div><p><span class="kbd">S</span> same &nbsp; <span class="kbd">D</span> different</p><button id="playPair">Play next pair</button><div id="phMsg" class="statusline"></div></div>';const key=e=>{if(!['s','d'].includes(e.key.toLowerCase()))return;rows.push({type:'phoneme',practice:false,block:blockIndex,response:e.key.toLowerCase(),rt_ms:0})};document.addEventListener('keydown',key);secondaryCleanup=()=>document.removeEventListener('keydown',key);$('playPair').onclick=playPair}function playPair(){const a=audioEls[Math.floor(Math.random()*7)],b=audioEls[Math.floor(Math.random()*7)];if(!a||!b)return;const aa=a.cloneNode(),bb=b.cloneNode();aa.currentTime=0;bb.currentTime=0;aa.play().catch(()=>{});aa.onended=()=>setTimeout(()=>bb.play().catch(()=>{}),400)}
function finish(){activeTetris?.stop();clearInterval(blockTimer);$('exp').classList.add('hidden');$('done').classList.remove('hidden');const counts={};rows.forEach(r=>counts[r.type]=(counts[r.type]||0)+1);$('finalSummary').innerHTML=`<p>Recorded ${rows.length} event rows.</p><div class="summary"><table><tr><th>Event type</th><th>Rows</th></tr>${Object.entries(counts).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table></div>`}$('download').onclick=()=>{const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))],csv=[keys.join(','),...rows.map(r=>keys.map(k=>JSON.stringify(r[k]??'')).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`wickens_${settings.pid||'participant'}.csv`;a.click()};
</script></body></html>
