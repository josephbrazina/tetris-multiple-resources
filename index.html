<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dual-task performance experiment</title>
<style>
:root{--bg:#292d33;--panel:#363c45;--text:#f2f4f7;--muted:#b8c0ca;--accent:#6ea8fe;--line:#56606c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:6px;padding:10px 16px;background:var(--accent);color:#08111f;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}main{max-width:1100px;margin:0 auto;padding:28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 8px 25px #0002}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700}.hint{color:var(--muted);font-size:13px}.field input,.field select{background:#252a31;border:1px solid #687483;border-radius:5px;color:var(--text);padding:9px}.wide{grid-column:1/-1}.status{margin:12px 0;padding:10px;border-radius:6px;background:#f0f2f5;color:#18202b;min-height:40px}.status.ok{background:#d8f7e3}.status.bad{background:#ffe0e0}.status.info{background:#e1edff}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.right{margin-left:auto}.experiment{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center}.task-layout{display:grid;grid-template-columns:360px 1fr;gap:40px;align-items:center;width:min(100%,1050px)}.solo{display:flex;justify-content:center}.task-side,.task-main{min-height:520px;display:flex;align-items:center;justify-content:center}.task-side{background:#252a31;border:1px solid var(--line);border-radius:8px}.tetris-wrap{display:flex;gap:18px;align-items:flex-start}.board-wrap{display:flex;flex-direction:column;align-items:center}.board{display:block;width:250px;height:500px;background:#0b0e12;border:3px solid #7d8997;image-rendering:pixelated}.next{width:120px}.nextbox{display:block;width:120px;height:120px;background:#0b0e12;border:2px solid #687483;margin-top:8px;image-rendering:pixelated}.secondary{text-align:center;width:100%}.secondary canvas{background:#20252b;border:1px solid var(--line);border-radius:8px}.big{font-size:28px}.kbd{display:inline-block;border:1px solid #8b98a8;border-bottom-width:3px;border-radius:5px;padding:2px 9px;margin:2px}.progress{height:8px;background:#1e2329;border-radius:4px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0}.statusline{min-height:24px;color:var(--muted)}.summary table{border-collapse:collapse;width:100%;font-size:13px}.summary th,.summary td{border:1px solid var(--line);padding:7px;text-align:left}.summary th{background:#252a31}.errorbox{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;background:#221b1b;padding:10px;border-radius:5px;color:#ffd0d0}@media(max-width:800px){main{padding:14px}.grid,.task-layout{grid-template-columns:1fr}.task-layout{gap:12px}.task-side,.task-main{min-height:400px}}
</style>
</head>
<body>
<main>
<section id="setup" class="panel">
<h1>Dual-task performance experiment</h1>
<p class="hint">Wickens' multiple resource theory: Tetris with visual-spatial mental rotation or auditory-verbal phoneme discrimination.</p>
<div class="grid">
<div class="field"><label for="pid">Participant ID <small>required</small></label><input id="pid" autocomplete="off"></div>
<div class="field"><label for="order">Block order</label><select id="order"><option value="latin">Counterbalanced Latin square</option><option value="singlefirst">Single tasks first, then dual tasks</option><option value="random">Fully random</option><option value="fixed">Fixed order</option></select></div>
<div class="field"><label for="blockSec">Block length, seconds</label><input id="blockSec" type="number" value="180" min="1"></div>
<div class="field"><label for="practiceSec">Practice length per task, seconds <small>0 = no practice</small></label><input id="practiceSec" type="number" value="90" min="0"></div>
<div class="field"><label for="speed">Tetris speed, ms per row <small>300–1000</small></label><input id="speed" type="number" value="650" min="300" max="1000"></div>
<div class="field"><label for="calibrate">Calibrate Tetris speed during practice</label><select id="calibrate"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div class="field"><label for="mrWindow">Mental rotation response window, seconds</label><input id="mrWindow" type="number" value="6" min="1"></div>
<div class="field"><label for="phWindow">Phoneme response window, seconds</label><input id="phWindow" type="number" value="2" min=".2" step=".1"></div>
<div class="field"><label for="stepDiff">Phoneme step difference in main blocks</label><select id="stepDiff"><option>2</option><option selected>3</option><option>4</option></select></div>
<div class="field"><label for="practiceAcc">Practice accuracy needed to move on</label><input id="practiceAcc" type="number" value="75" min="1" max="100">%</div>
<div class="field"><label for="maxAttempts">Maximum practice attempts per task</label><input id="maxAttempts" type="number" value="3" min="1" max="10"></div>
<div class="wide"><div id="trialInfo" class="status info"></div></div>
<div class="wide"><div id="audioStatus" class="status info">Loading audio files…</div><div id="audioDetails" class="hint"></div></div>
<div class="wide row"><button id="start" disabled>Start experiment</button><span class="hint">All seven WAV files must load before the experiment can start.</span></div>
</div>
</section>
<section id="exp" class="experiment hidden"><div id="expContent" class="panel" style="width:100%"></div></section>
<section id="done" class="panel hidden"><h1>Experiment complete</h1><div id="finalSummary"></div><button id="download">Download CSV</button></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const audioNames=Array.from({length:7},(_,i)=>`step${i+1}.wav`),audioEls=[];
const conditions=['tetris','mental','phoneme','tetris+mental','tetris+phoneme'];
const COLORS={I:'#39c5ff',J:'#4e7cff',L:'#ff9f43',O:'#ffd447',S:'#57d68d',T:'#b27cff',Z:'#ff5c6c'};
const IDS={I:1,J:2,L:3,O:4,S:5,T:6,Z:7};
const SHAPES={I:[[1,1,1,1]],O:[[1,1],[1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],T:[[0,1,0],[1,1,1]]};
let audioReady=false,settings={},rows=[],order=[],blockIndex=0,blockTimer=0,blockStart=0,currentCondition='',activeTetris=null,secondaryCleanup=null;
function assetUrl(name){return new URL(`stimuli/${name}`,document.baseURI).href}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setAudioStatus(text,kind='info'){$('audioStatus').textContent=text;$('audioStatus').className=`status ${kind}`}
function loadOne(name,index){return new Promise((resolve,reject)=>{const a=new Audio(),url=assetUrl(name);let finished=false;const done=(ok,msg='')=>{if(finished)return;finished=true;clearTimeout(timer);events.forEach(e=>a.removeEventListener(e,handler));ok?(audioEls[index]=a,resolve(a)):reject(new Error(`${name}: ${msg||'could not load or decode'}\nURL: ${url}`))};const handler=e=>e.type==='error'?done(false,a.error?`media error ${a.error.code}`:'load error'):done(true);const events=['loadedmetadata','loadeddata','canplay','canplaythrough','error','abort'];const timer=setTimeout(()=>done(false,'timed out after 15 seconds'),15000);events.forEach(e=>a.addEventListener(e,handler));a.preload='auto';a.src=url;a.load()})}
async function loadAudio(){for(let i=0;i<audioNames.length;i++){setAudioStatus(`Loading ${i+1}/7: ${audioNames[i]}…`);$('audioDetails').textContent=assetUrl(audioNames[i]);try{await loadOne(audioNames[i],i)}catch(e){setAudioStatus('Audio loading failed','bad');$('audioDetails').innerHTML=`<div class="errorbox">${esc(e.message)}</div>`;return}}audioReady=true;setAudioStatus('All 7 WAV files loaded successfully','ok');$('audioDetails').textContent='The Start button is enabled.';$('start').disabled=false}
function updateInfo(){const sec=Math.max(1,+$('blockSec').value||180);$('trialInfo').textContent=`Phoneme: ${Math.floor(sec/3)} pairs, one every 3 s. Mental rotation: ${Math.floor(sec/6)} trials, one every 6 s.`}
$('blockSec').addEventListener('input',updateInfo);updateInfo();loadAudio();
function readSettings(){settings={pid:$('pid').value.trim(),order:$('order').value,blockSec:+$('blockSec').value,practiceSec:+$('practiceSec').value,speed:+$('speed').value,stepDiff:+$('stepDiff').value,mrWindow:+$('mrWindow').value,phWindow:+$('phWindow').value}}
function valid(){readSettings();if(!settings.pid){alert('Enter a participant ID.');$('pid').focus();return false}if(settings.order==='latin'&&!/[0-9]/.test(settings.pid)){alert('Counterbalanced order requires a participant ID containing a number.');$('pid').focus();return false}if(!audioReady){setAudioStatus('Cannot start: all seven WAV files are not loaded','bad');return false}if(settings.speed<300||settings.speed>1000||settings.blockSec<=0){alert('Check the numeric settings.');return false}return true}
function blurButton(e){if(e.currentTarget) e.currentTarget.blur()}
$('start').addEventListener('click',e=>{blurButton(e);if(!valid())return;$('setup').classList.add('hidden');$('exp').classList.remove('hidden');order=makeOrder();blockIndex=0;runNextBlock()});
$('download').addEventListener('click',e=>{blurButton(e);downloadCSV()});
function makeOrder(){const a=conditions.slice();if(settings.order==='random')return a.sort(()=>Math.random()-.5);if(settings.order==='singlefirst')return ['tetris','mental','phoneme','tetris+mental','tetris+phoneme'];if(settings.order==='fixed')return a;const n=(parseInt((settings.pid.match(/\d+/)||['1'])[0],10)-1)%5;return a.slice(n).concat(a.slice(0,n))}
function label(c){return {tetris:'Tetris only',mental:'Mental rotation only',phoneme:'Phoneme discrimination only','tetris+mental':'Tetris + mental rotation','tetris+phoneme':'Tetris + phoneme discrimination'}[c]}
function instructions(c){return c.includes('mental')?'Press S when the objects are the same and D when the right object is a mirror image.':c.includes('phoneme')?'Press S for same and D for different.':'Use ←/→ to move, ↑ to rotate, ↓ to move down one row, and SPACE to hard-drop.'}
function runNextBlock(){if(blockIndex>=order.length){finish();return}currentCondition=order[blockIndex];blockStart=performance.now();$('expContent').innerHTML=`<div class="row"><h2>${label(currentCondition)}</h2><span class="right" id="clock"></span></div><div class="progress"><i id="bar"></i></div><div id="task" class="task-main"></div><p class="hint">${instructions(currentCondition)}</p>`;activeTetris?.stop();secondaryCleanup?.();secondaryCleanup=null;const task=$('task');if(currentCondition==='tetris')startTetris(task);else if(currentCondition==='mental')startMental(task);else if(currentCondition==='phoneme')startPhoneme(task);else{task.className='task-layout';task.innerHTML='<div class="task-side" id="secondary"></div><div class="task-main" id="primary"></div>';currentCondition==='tetris+mental'?startMental($('secondary')):startPhoneme($('secondary'));startTetris($('primary'))}blockTimer=setInterval(updateBlock,50)}
function updateBlock(){const elapsed=(performance.now()-blockStart)/1000,left=Math.max(0,settings.blockSec-elapsed);$('clock').textContent=`${left.toFixed(1)} s`;$('bar').style.width=`${Math.min(100,elapsed/settings.blockSec*100)}%`;if(left<=0){clearInterval(blockTimer);activeTetris?.stop();secondaryCleanup?.();rows.push({type:'summary',practice:false,block:blockIndex,condition:currentCondition,duration_s:settings.blockSec});blockIndex++;runNextBlock()}}
function startTetris(el){el.className='task-main solo';el.innerHTML='<div class="tetris-wrap"><div class="board-wrap"><canvas id="tetrisCanvas" class="board" width="250" height="500"></canvas><p class="hint">←/→ move · ↑ rotate · ↓ one row · SPACE hard-drop</p><div id="tetrisMsg" class="statusline"></div></div><div class="next"><b>Next piece</b><canvas id="nextCanvas" class="nextbox" width="120" height="120"></canvas></div></div>';activeTetris=new TetrisGame($('tetrisCanvas'),$('nextCanvas'),settings.speed);activeTetris.start()}
class TetrisGame{
constructor(canvas,nextCanvas,dropMs){this.canvas=canvas;this.nextCanvas=nextCanvas;this.ctx=canvas.getContext('2d');this.nctx=nextCanvas.getContext('2d');this.dropMs=dropMs;this.board=Array.from({length:20},()=>Array(10).fill(0));this.bag=[];this.current=null;this.next=null;this.shape=null;this.x=3;this.y=0;this.lastDrop=performance.now();this.pieceShown=performance.now();this.running=false;this.raf=0;this.boundKey=e=>this.key(e);this.spawn()}
newBag(){this.bag=['I','J','L','O','S','T','Z'];for(let i=this.bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[this.bag[i],this.bag[j]]=[this.bag[j],this.bag[i]]}}
pick(){if(!this.bag.length)this.newBag();return this.bag.pop()}
spawn(){this.current=this.next||this.pick();this.next=this.pick();this.shape=SHAPES[this.current].map(row=>row.slice());this.x=3;this.y=0;this.pieceShown=performance.now();this.lastDrop=performance.now();this.drawPreview();if(this.collides(this.shape,this.x,this.y)){rows.push({type:'game_over',practice:false,block:blockIndex});this.board=Array.from({length:20},()=>Array(10).fill(0));this.spawn()}}
start(){if(this.running)return;this.running=true;document.addEventListener('keydown',this.boundKey);this.draw();this.raf=requestAnimationFrame(t=>this.loop(t))}
stop(){this.running=false;document.removeEventListener('keydown',this.boundKey);cancelAnimationFrame(this.raf)}
loop(now){if(!this.running)return;if(now-this.lastDrop>=this.dropMs){this.lastDrop=now;if(!this.tryMove(0,1))this.lock(false)}this.draw();this.raf=requestAnimationFrame(t=>this.loop(t))}
key(e){if(!this.running)return;const tag=e.target?.tagName?.toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||e.isComposing)return;const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();if(k==='ArrowLeft')this.tryMove(-1,0);else if(k==='ArrowRight')this.tryMove(1,0);else if(k==='ArrowDown')this.tryMove(0,1);else if(k==='ArrowUp')this.rotate();else if(k===' ')this.hardDrop();}
tryMove(dx,dy){if(this.collides(this.shape,this.x+dx,this.y+dy))return false;this.x+=dx;this.y+=dy;return true}
rotate(){const h=this.shape.length,w=this.shape[0].length,out=Array.from({length:w},()=>Array(h).fill(0));for(let y=0;y<h;y++)for(let x=0;x<w;x++)out[x][h-1-y]=this.shape[y][x];const old=this.shape;this.shape=out;if(this.collides(this.shape,this.x,this.y)){for(const kick of [-1,1,-2,2])if(!this.collides(this.shape,this.x+kick,this.y)){this.x+=kick;return true}this.shape=old;return false}return true}
hardDrop(){let distance=0;while(this.tryMove(0,1))distance++;this.lock(true,distance)}
lock(hard,distance=0){const piece=this.current,shown=this.pieceShown;for(let sy=0;sy<this.shape.length;sy++)for(let sx=0;sx<this.shape[sy].length;sx++)if(this.shape[sy][sx]){const x=this.x+sx,y=this.y+sy;if(y>=0&&y<20&&x>=0&&x<10)this.board[y][x]=IDS[piece]}const before=this.board.reduce((n,row)=>n+(row.every(v=>v)?1:0),0);let cleared=0;for(let y=19;y>=0;y--)if(this.board[y].every(v=>v)){this.board.splice(y,1);this.board.unshift(Array(10).fill(0));cleared++;y++}const holes=this.countHoles(),height=this.stackHeight();rows.push({type:'tetris_piece',practice:false,block:blockIndex,piece,piece_id:IDS[piece],placement_ms:Math.round(performance.now()-shown),hard_drop:!!hard,hard_drop_rows:distance,lines_cleared:cleared,holes,stack_height:height});this.spawn()}
countHoles(){let holes=0;for(let x=0;x<10;x++){let filled=false;for(let y=0;y<20;y++){if(this.board[y][x])filled=true;else if(filled)holes++}}return holes}
stackHeight(){let top=20;for(let y=0;y<20;y++)if(this.board[y].some(Boolean)){top=y;break}return 20-top}
draw(){const s=25,c=this.ctx;c.clearRect(0,0,250,500);c.fillStyle='#0b0e12';c.fillRect(0,0,250,500);for(let y=0;y<20;y++)for(let x=0;x<10;x++)if(this.board[y][x])this.cell(c,x,y,Object.keys(IDS).find(k=>IDS[k]===this.board[y][x]),s);for(let sy=0;sy<this.shape.length;sy++)for(let sx=0;sx<this.shape[sy].length;sx++)if(this.shape[sy][sx]&&this.y+sy>=0)this.cell(c,this.x+sx,this.y+sy,this.current,s)}
cell(c,x,y,p,s){c.fillStyle=COLORS[p];c.fillRect(x*s+1,y*s+1,s-2,s-2);c.strokeStyle='#101318';c.lineWidth=2;c.strokeRect(x*s+2,y*s+2,s-4,s-4)}
drawPreview(){const c=this.nctx,s=25;c.clearRect(0,0,120,120);c.fillStyle='#0b0e12';c.fillRect(0,0,120,120);const sh=SHAPES[this.next],w=sh[0].length,h=sh.length,ox=(120-w*s)/2,oy=(120-h*s)/2;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(sh[y][x])this.cell(c,(ox+x*s)/s,(oy+y*s)/s,this.next,s)}
}
function startMental(el){el.className='task-main solo';el.innerHTML='<div class="secondary"><canvas id="mrCanvas" width="700" height="380"></canvas><p class="big"><span class="kbd">S</span> same &nbsp; <span class="kbd">D</span> mirror</p><div id="mrMsg" class="statusline">Mental rotation task placeholder</div></div>';const key=e=>{if(['input','textarea','select'].includes(e.target?.tagName?.toLowerCase()))return;if(!['s','d'].includes(e.key.toLowerCase()))return;rows.push({type:'mental_rotation',practice:false,block:blockIndex,response:e.key.toLowerCase(),rt_ms:''})};document.addEventListener('keydown',key);secondaryCleanup=()=>document.removeEventListener('keydown',key);const c=$('mrCanvas'),x=c.getContext('2d');x.fillStyle='#20252b';x.fillRect(0,0,c.width,c.height);for(const cx of [180,520]){x.fillStyle='#6ea8fe';x.strokeStyle='#111';x.lineWidth=4;for(let i=0;i<5;i++){const px=cx+(i%3-1)*42,py=150+Math.floor(i/3)*42;x.fillRect(px,py,38,38);x.strokeRect(px,py,38,38)}}}
function startPhoneme(el){el.className='task-main solo';el.innerHTML='<div class="secondary"><div class="big">Listen, then respond</div><p><span class="kbd">S</span> same &nbsp; <span class="kbd">D</span> different</p><button id="playPair">Play next pair</button><div id="phMsg" class="statusline"></div></div>';const key=e=>{if(['input','textarea','select'].includes(e.target?.tagName?.toLowerCase()))return;if(!['s','d'].includes(e.key.toLowerCase()))return;rows.push({type:'phoneme',practice:false,block:blockIndex,response:e.key.toLowerCase(),rt_ms:''})};document.addEventListener('keydown',key);secondaryCleanup=()=>document.removeEventListener('keydown',key);$('playPair').addEventListener('click',e=>{blurButton(e);playPair()})}
function playPair(){const a=audioEls[Math.floor(Math.random()*7)],b=audioEls[Math.floor(Math.random()*7)];if(!a||!b)return;const first=a.cloneNode(),second=b.cloneNode();first.currentTime=0;second.currentTime=0;first.play().catch(()=>{});first.onended=()=>setTimeout(()=>second.play().catch(()=>{}),400)}
function finish(){activeTetris?.stop();clearInterval(blockTimer);$('exp').classList.add('hidden');$('done').classList.remove('hidden');const counts={};rows.forEach(r=>counts[r.type]=(counts[r.type]||0)+1);$('finalSummary').innerHTML=`<p>Recorded ${rows.length} event rows.</p><div class="summary"><table><tr><th>Event type</th><th>Rows</th></tr>${Object.entries(counts).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table></div>`}
function downloadCSV(){const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))],csv=[keys.join(','),...rows.map(r=>keys.map(k=>JSON.stringify(r[k]??'')).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`wickens_${settings.pid||'participant'}.csv`;a.click()}
</script>
</body>
</html>
