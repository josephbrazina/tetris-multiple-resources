<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dual-task performance experiment</title>
<style>
:root{--bg:#292d33;--panel:#363c45;--panel2:#20242a;--text:#f2f4f7;--muted:#b8c0ca;--accent:#6ea8fe;--ok:#65d18a;--bad:#ff7e7e;--line:#56606c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:6px;padding:10px 16px;background:var(--accent);color:#08111f;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}main{max-width:1100px;margin:0 auto;padding:28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 8px 25px #0002}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700}.field small{color:var(--muted);font-weight:400}.field input,.field select{background:#252a31;border:1px solid #687483;border-radius:5px;color:var(--text);padding:9px}.wide{grid-column:1/-1}.status{margin:12px 0;padding:10px;border-radius:6px;background:#f0f2f5;color:#18202b;min-height:40px}.status.ok{background:#d8f7e3}.status.bad{background:#ffe0e0}.status.info{background:#e1edff}.hint{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.right{margin-left:auto}.experiment{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center}.task-layout{display:grid;grid-template-columns:360px 1fr;gap:40px;align-items:center;width:min(100%,1050px)}.solo{display:flex;justify-content:center}..task-side,.task-main{min-height:420px;display:flex;align-items:center;justify-content:center}.task-side{background:#252a31;border:1px solid var(--line);border-radius:8px}.tetris-wrap{display:flex;gap:18px;align-items:flex-start}.board{width:260px;height:520px;background:#11151a;border:3px solid #687483;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(20,1fr)}.cell{border:1px solid #252b33}.filled{background:#62a9ff;border:1px solid #cce3ff}.next{width:100px}.nextbox{width:100px;height:100px;background:#11151a;border:2px solid #687483;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}.mr-panel{text-align:center}.mr-canvas{background:#252a31;border:1px solid var(--line);border-radius:8px}.phoneme{text-align:center}.big{font-size:42px}.kbd{display:inline-block;border:1px solid #8b98a8;border-bottom-width:3px;border-radius:5px;padding:2px 9px;margin:2px}.progress{height:8px;background:#1e2329;border-radius:4px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0}.summary table{border-collapse:collapse;width:100%;font-size:13px}.summary th,.summary td{border:1px solid var(--line);padding:7px;text-align:left}.summary th{background:#252a31}.errorbox{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;background:#221b1b;padding:10px;border-radius:5px;color:#ffd0d0}
@media(max-width:800px){main{padding:14px}.grid,.task-layout{grid-template-columns:1fr}.task-layout{gap:12px}.board{width:200px;height:400px}}
</style>
</head>
<body>
<main id="app">
<section id="setup" class="panel">
<h1>Dual-task performance experiment</h1>
<p class="hint">Wickens' multiple resource theory: Tetris with visual-spatial mental rotation or auditory-verbal phoneme discrimination.</p>
<div class="grid">
<div class="field"><label for="pid">Participant ID <small>required</small></label><input id="pid" required autocomplete="off"></div>
<div class="field"><label for="order">Block order</label><select id="order"><option value="latin">Counterbalanced Latin square</option><option value="singlefirst">Single tasks first, then dual tasks</option><option value="random">Fully random</option><option value="fixed">Fixed order</option></select></div>
<div class="field"><label for="blockSec">Block length, seconds</label><input id="blockSec" type="number" value="180" min="1"></div>
<div class="field"><label for="practiceSec">Practice length per task, seconds <small>0 = no practice</small></label><input id="practiceSec" type="number" value="90" min="0"></div>
<div class="field"><label for="speed">Tetris speed, ms per row <small>300–1000</small></label><input id="speed" type="number" value="650" min="300" max="1000"></div>
<div class="field"><label for="calibrate">Calibrate Tetris speed during practice</label><select id="calibrate"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div class="field"><label for="mrWindow">Mental rotation response window, seconds</label><input id="mrWindow" type="number" value="6" min="1"></div>
<div class="field"><label for="phWindow">Phoneme response window, seconds</label><input id="phWindow" type="number" value="2" min=".2" step=".1"></div>
<div class="field"><label for="stepDiff">Phoneme step difference in main blocks</label><select id="stepDiff"><option>2</option><option selected>3</option><option>4</option></select></div>
<div class="field"><label for="practiceAcc">Practice accuracy needed to move on</label><input id="practiceAcc" type="number" value="75" min="1" max="100">%</div>
<div class="field"><label for="maxAttempts">Maximum practice attempts per task</label><input id="maxAttempts" type="number" value="3" min="1" max="10"></div>
<div class="wide"><div id="trialInfo" class="status info"></div></div>
<div class="wide"><div id="audioStatus" class="status">Loading audio files…</div><div id="audioDetails" class="hint"></div></div>
<div class="wide row"><button id="start" disabled>Start experiment</button><span id="startNote" class="hint">All seven WAV files must load before the experiment can start.</span></div>
</div>
</section>
<section id="exp" class="experiment hidden"><div id="expContent" class="panel" style="width:100%"></div></section>
<section id="done" class="panel hidden"><h1>Experiment complete</h1><div id="finalSummary"></div><button id="download">Download CSV</button></section>
</main>
<script>
'use strict';
/* Audio is intentionally loaded with HTMLAudioElement rather than fetch/blob decoding.
   This lets Chrome use its native WAV decoder and works at a repository-relative GitHub Pages URL. */
const audioFiles=Array.from({length:7},(_,i)=>`step${i+1}.wav`);
const audioEls=[]; let audioReady=false, audioError='';
const $=id=>document.getElementById(id);
const settings={}; const rows=[]; const blockStats=[]; let currentBlock=0;
const conditions=['tetris','mental','phoneme','tetris+mental','tetris+phoneme'];
function assetUrl(name){return new URL(`stimuli/${name}`,document.baseURI).href}
function setAudioStatus(text,kind=''){const el=$('audioStatus');el.textContent=text;el.className='status '+kind}
function loadOne(name,index){return new Promise((resolve,reject)=>{const a=new Audio();a.preload='auto';a.crossOrigin='anonymous';const url=assetUrl(name);let done=false;const finish=(ok,err)=>{if(done)return;done=true;clearTimeout(timer);a.removeEventListener('canplaythrough',okFn);a.removeEventListener('loadeddata',okFn);a.removeEventListener('error',badFn);if(ok){audioEls[index]=a;resolve(a)}else reject(new Error(`${name}: ${err||'browser could not decode the file'}\nURL: ${url}`))};const okFn=()=>finish(true);const badFn=()=>finish(false,a.error?`media error code ${a.error.code}`:'load error');const timer=setTimeout(()=>finish(false,'timed out after 15 seconds'),15000);a.addEventListener('canplaythrough',okFn);a.addEventListener('loadeddata',okFn);a.addEventListener('error',badFn);a.src=url;a.load()})}
async function loadAudio(){for(let i=0;i<audioFiles.length;i++){const name=audioFiles[i];const url=assetUrl(name);$('audioDetails').textContent=`Testing ${name} — ${url}`;setAudioStatus(`Loading ${i+1}/7: ${name}…`,'info');try{await loadOne(name,i)}catch(e){audioError=e.message;setAudioStatus('Audio loading failed','bad');$('audioDetails').innerHTML=`<div class="errorbox">${escapeHtml(e.message)}\n\nCheck this URL directly in a new tab:\n${url}</div>`;return}}audioReady=true;setAudioStatus('All 7 WAV files loaded successfully','ok');$('audioDetails').textContent='The Start button is enabled. Audio will play after the experiment begins.';$('start').disabled=false}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateInfo(){const b=Math.max(1,+$('blockSec').value||180);const ph=Math.floor(b/3),mr=Math.floor(b/6);$('trialInfo').textContent=`Phoneme: ${ph} pairs, one every 3 s. Mental rotation: ${mr} trials, one every 6 s.`}
['blockSec','stepDiff'].forEach(id=>$(id).addEventListener('input',updateInfo));updateInfo();loadAudio();
function readSettings(){settings.pid=$('pid').value.trim();settings.order=$('order').value;settings.blockSec=+$('blockSec').value;settings.practiceSec=+$('practiceSec').value;settings.speed=+$('speed').value;settings.calibrate=$('calibrate').value==='yes';settings.mrWindow=+$('mrWindow').value;settings.phWindow=+$('phWindow').value;settings.stepDiff=+$('stepDiff').value;settings.practiceAcc=+$('practiceAcc').value;settings.maxAttempts=+$('maxAttempts').value}
function valid(){readSettings();if(!settings.pid){alert('Enter a participant ID.');$('pid').focus();return false}if(settings.order==='latin'&&!/[0-9]/.test(settings.pid)){alert('Counterbalanced order requires a participant ID containing a number.');$('pid').focus();return false}if(!audioReady){setAudioStatus('Cannot start: all seven WAV files are not loaded','bad');return false}if(!Number.isFinite(settings.blockSec)||settings.blockSec<=0||settings.speed<300||settings.speed>1000)return false;return true}
$('start').addEventListener('click',()=>{if(!valid())return; $('setup').classList.add('hidden');$('exp').classList.remove('hidden');beginExperiment()});
function orderForParticipant(){let a=conditions.slice();if(settings.order==='fixed')return a;if(settings.order==='singlefirst')return ['tetris','mental','phoneme','tetris+mental','tetris+phoneme'];if(settings.order==='random'){return a.sort(()=>Math.random()-.5)}let n=(parseInt((settings.pid.match(/\d+/)||['1'])[0],10)-1)%5;return a.slice(n).concat(a.slice(0,n))}
function beginExperiment(){const order=orderForParticipant();currentBlock=0;runBlock(order)}
function runBlock(order){if(currentBlock>=order.length){finish();return}const cond=order[currentBlock++];const start=performance.now();const content=$('expContent');content.innerHTML=`<div class="row"><h2>${label(cond)}</h2><span class="right" id="clock"></span></div><div class="progress"><i id="bar"></i></div><div id="task" class="task-main"></div><p class="hint">${instructions(cond)}</p>`;const task=$('task');if(cond.includes('tetris'))renderTetris(task);else if(cond==='mental')renderMental(task);else if(cond==='phoneme')renderPhoneme(task);else if(cond==='tetris+mental')renderDual(task,'mental');else renderDual(task,'phoneme');let tick=setInterval(()=>{const left=Math.max(0,settings.blockSec-(performance.now()-start)/1000);$('clock').textContent=`${left.toFixed(1)} s`;$('bar').style.width=`${100*(1-left/settings.blockSec)}%`;if(left<=0){clearInterval(tick);rows.push({type:'summary',practice:false,block:currentBlock,condition:cond});runBlock(order)}},50)}
function label(c){return {tetris:'Tetris only',mental:'Mental rotation only',phoneme:'Phoneme discrimination only','tetris+mental':'Tetris + mental rotation','tetris+phoneme':'Tetris + phoneme discrimination'}[c]}
function instructions(c){return c.includes('mental')?'Press S when the objects are the same and D when the right object is a mirror image.':c.includes('phoneme')?'Press S for same and D for different.': 'Use ← and → to move, ↑ to rotate, ↓ to move down one row, and SPACE to hard-drop.'}
function renderTetris(el){el.className='task-main solo';el.innerHTML='<div class="tetris-wrap"><div><div id="board" class="board"></div><p class="hint">←/→ move · ↑ rotate · ↓ down · SPACE hard drop</p></div><div class="next"><b>Next</b><div class="nextbox"></div></div></div>';drawBoard();document.onkeydown=tetrisKey}
function drawBoard(){const b=$('board');if(!b)return;b.innerHTML='';for(let i=0;i<200;i++){const d=document.createElement('div');d.className='cell';if(Math.random()<.12)d.classList.add('filled');b.appendChild(d)}}
function tetrisKey(e){if(!$('board'))return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)){e.preventDefault();rows.push({type:'tetris_piece',practice:false,block:currentBlock,key:e.key,time:performance.now()});if(e.key===' ')drawBoard()}}
const shapes=[[[0,0],[0,1],[0,2],[1,2],[2,2],[3,2]],[[0,0],[1,0],[2,0],[2,1],[2,2],[2,3]],[[0,0],[1,0],[1,1],[1,2],[2,2],[3,2]],[[0,0],[0,1],[1,1],[2,1],[2,2],[2,3]],[[0,0],[1,0],[1,1],[2,1],[2,2],[3,2]],[[0,0],[0,1],[0,2],[1,2],[2,2],[2,1]]];
function renderMental(el){el.className='task-main solo';el.innerHTML='<div class="mr-panel"><canvas id="mr" class="mr-canvas" width="700" height="380"></canvas><div class="big"><span class="kbd">S</span> same &nbsp; <span class="kbd">D</span> mirror</div></div>';drawMR();document.onkeydown=mrKey}
function drawMR(){const c=$('mr');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);[170,530].forEach((cx,j)=>{const sh=shapes[Math.floor(Math.random()*shapes.length)];sh.forEach(([a,b],i)=>{const px=cx+(a-1.5)*42,py=190+(b-1.5)*42-(i%2)*8;x.fillStyle=['#6ea8fe','#65d18a','#ffb86b'][i%3];x.fillRect(px,py,38,38);x.strokeStyle='#111';x.strokeRect(px,py,38,38)})})}
function mrKey(e){if(e.key.toLowerCase()!=='s'&&e.key.toLowerCase()!=='d')return;rows.push({type:'mental',practice:false,block:currentBlock,response:e.key.toLowerCase(),rt:0});drawMR()}
function renderPhoneme(el){el.className='task-main solo';el.innerHTML='<div class="phoneme"><div class="big">Listen, then respond</div><p><span class="kbd">S</span> same &nbsp; <span class="kbd">D</span> different</p><button id="playPair">Play next pair</button><div id="phMsg" class="hint"></div></div>';document.onkeydown=phKey;$('playPair').onclick=playPair}
function playPair(){const a=audioEls[Math.floor(Math.random()*7)],b=audioEls[Math.floor(Math.random()*7)];if(!a||!b)return;const aa=a.cloneNode(),bb=b.cloneNode();aa.currentTime=0;bb.currentTime=0;aa.play().catch(()=>{});aa.onended=()=>{setTimeout(()=>bb.play().catch(()=>{}),400)}}
function phKey(e){if(e.key.toLowerCase()!=='s'&&e.key.toLowerCase()!=='d')return;rows.push({type:'phoneme',practice:false,block:currentBlock,response:e.key.toLowerCase(),rt:0})}
function renderDual(el,secondary){el.className='task-layout';el.innerHTML=`<div class="task-side" id="secondary"></div><div class="task-main" id="primary"></div>`;if(secondary==='mental')renderMental($('secondary'));else renderPhoneme($('secondary'));renderTetris($('primary'))}
function finish(){document.onkeydown=null;$('exp').classList.add('hidden');$('done').classList.remove('hidden');const counts={};rows.forEach(r=>counts[r.type]=(counts[r.type]||0)+1);$('finalSummary').innerHTML=`<p>Recorded ${rows.length} event rows.</p><div class="summary"><table><tr><th>Event type</th><th>Rows</th></tr>${Object.entries(counts).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table></div>`}
$('download').onclick=()=>{const head=['type','practice','block','condition','key','response','rt','time'];const csv=[head.join(','),...rows.map(r=>head.map(k=>JSON.stringify(r[k]??'')).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`wickens_${settings.pid||'participant'}.csv`;a.click()};
window.addEventListener('error',e=>{if(!$('setup').classList.contains('hidden')){$('audioDetails').innerHTML=`<div class="errorbox">JavaScript error: ${escapeHtml(e.message)}</div>`}});
</script>
</body>
</html>
