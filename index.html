<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mental Rotation Task</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b1224;color:#eef4ff;margin:0;padding:28px}main{max-width:1050px;margin:auto}.card{background:#172238;border:1px solid #405270;border-radius:14px;padding:22px}h1{margin-top:0}.controls{display:flex;gap:12px;flex-wrap:wrap}.controls label{display:grid;gap:5px;flex:1;min-width:220px}input,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #526784;background:#0d172a;color:white}button{cursor:pointer;background:#168caf;font-weight:700}.secondary{background:#263653}.hidden{display:none}.meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.bar{height:7px;background:#091020;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#43d5df;width:0}.stimuli{display:grid;grid-template-columns:1fr 1fr;gap:70px;position:relative;margin-top:18px}.stimulus{text-align:center}.stimulus img{width:100%;max-width:410px;aspect-ratio:1;object-fit:contain;background:#101b2d;border:1px solid #405270;border-radius:10px}.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;color:#ffc44d;font-weight:bold}.answers{text-align:center;margin-top:20px}.answers button{margin:5px;min-width:135px}.status{margin-top:14px;padding:11px;background:#0d172a;border-radius:8px;min-height:22px}.small{color:#b9c6dd;font-size:13px}@media(max-width:700px){body{padding:12px}.stimuli{gap:10px}.vs{display:none}}
</style></head><body><main>
<section id="setup" class="card"><h1>Mental Rotation Task</h1><p>Press <b>S</b> for same and <b>D</b> for different.</p><div class="controls"><label>Participant ID<input id="pid"></label><label>Number of trials<input id="n" type="number" min="2" max="140" value="20"></label></div><br><button id="start">Start task</button><p class="small">Uses figures A–J and rotation indices 0–14 from the bundled stimuli folder.</p></section>
<section id="task" class="card hidden"><div class="meta"><span>Trial <b id="num"></b>/<b id="total"></b></span><span>Accuracy <b id="acc">—</b></span></div><div class="bar"><div id="fill"></div></div><div class="stimuli"><div class="stimulus"><p>Structure 1</p><img id="left"></div><div class="vs">VS</div><div class="stimulus"><p>Structure 2</p><img id="right"></div></div><div class="answers"><button data-a="same"><b>S</b> Same</button><button class="secondary" data-a="different"><b>D</b> Different</button></div><div id="status" class="status">Use S or D.</div><button id="download" class="secondary hidden">Download CSV</button></section>
</main><script>
const root='stimuli',figs='ABCDEFGHIJ'.split(''),indices=Array.from({length:15},(_,i)=>i);let trials=[],i=0,rows=[],t0=0,pid='';
const $=x=>document.getElementById(x),imgPath=(kind,f,j)=>kind==='same'?`${root}/rotations/${f}/${f}${j}.jpg`:`${root}/mirrored/${f}/${f}${j}_m.jpg`;
function trial(){const f=figs[Math.floor(Math.random()*figs.length)],j=indices[Math.floor(Math.random()*15)],same=Math.random()<.5,j2=indices[Math.floor(Math.random()*15)],c=same?'same':'different';return{f,j,j2,c,left:imgPath('same',f,j),right:imgPath(c,f,j2)}}
function setim(el,src){el.onerror=()=>{$('status').textContent='Stimulus unavailable: '+src;};el.src=src}
function stats(){const k=rows.filter(x=>x.correct).length;$('acc').textContent=rows.length?Math.round(100*k/rows.length)+'%':'—';$('fill').style.width=100*i/trials.length+'%'}
function show(){if(i>=trials.length){$('status').textContent='Finished.';$('download').classList.remove('hidden');stats();return}const x=trials[i];$('num').textContent=i+1;$('total').textContent=trials.length;$('status').textContent='Use S or D.';setim($('left'),x.left);setim($('right'),x.right);t0=performance.now();stats()}
function answer(a){if(i>=trials.length)return;const x=trials[i++];rows.push({participant:pid,trial:i,figure:x.f,index1:x.j,index2:x.j2,condition:x.c,response:a,correct:a===x.c,rt_ms:Math.round(performance.now()-t0),left_path:x.left,right_path:x.right});show()}
$('start').onclick=()=>{pid=$('pid').value.trim()||'anonymous';trials=Array.from({length:Math.max(2,Math.min(140,+$('n').value||20))},trial);i=0;rows=[];$('setup').classList.add('hidden');$('task').classList.remove('hidden');document.querySelectorAll('.answers button').forEach(b=>b.disabled=false);show()};
document.querySelectorAll('.answers button').forEach(b=>b.onclick=()=>answer(b.dataset.a));document.onkeydown=e=>{if(e.key.toLowerCase()==='s')answer('same');if(e.key.toLowerCase()==='d')answer('different')};
$('download').onclick=()=>{const cs=Object.keys(rows[0]),csv=[cs.join(','),...rows.map(r=>cs.map(c=>JSON.stringify(r[c])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mental_rotation_data.csv';a.click()}
</script></body></html>
