<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phoneme Discrimination Task</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1224;color:#eef4ff;display:grid;place-items:center;padding:24px}.card{width:min(760px,100%);background:#172139;border:1px solid #304264;border-radius:14px;padding:22px}.hidden{display:none!important}h1{margin:0 0 8px;font-size:26px}p{color:#b9c7df;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input{background:#0e172c;color:#fff;border:1px solid #425579;border-radius:8px;padding:11px;font-size:16px}button{cursor:pointer;border:1px solid #5274a7;background:#243756;color:#fff;border-radius:8px;padding:11px 16px;font-weight:700}button.primary{background:#167eaa;border-color:#35c1e7}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{margin-top:14px;padding:11px;border-radius:8px;background:#0e172c;color:#c9d7ee}.warning{color:#ffb4a8}.task-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;color:#c9d7ee}.bar-wrap{height:8px;background:#0e172c;border-radius:99px;overflow:hidden;margin-bottom:28px}.bar{height:100%;width:0;background:#73e5e5}.responses{display:flex;justify-content:center;gap:14px;margin-top:28px}.response{min-width:140px;font-size:16px}.response kbd{padding:2px 6px;border:1px solid #8ba2c4;border-radius:5px;margin-right:6px}.center{text-align:center}.small{font-size:13px;color:#9dafca}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<main class="card">
<section id="setup">
<h1>Phoneme Discrimination Task</h1>
<p>Decide whether the two sounds are the same or different. Press <b>S</b> for same and <b>D</b> for different. Each trial lasts 3 seconds; a response never starts the next trial early.</p>
<div class="grid"><div class="field"><label for="participant">Participant ID</label><input id="participant" autocomplete="off"></div></div>
<div id="loadStatus" class="status">Loading audio stimuli…</div>
<div class="row" style="margin-top:14px"><button id="start" class="primary" disabled>Start task</button></div>
</section>
<section id="task" class="hidden">
<div class="task-head"><span>Trial <b id="trialNo">0</b> / 60</span><span>Accuracy: <b id="accuracy">—</b></span></div>
<div class="bar-wrap"><div id="bar" class="bar"></div></div>
<div class="center"><h2>Listen</h2><p id="taskStatus">Respond within 3 seconds.</p></div>
<div class="responses"><button class="response" data-response="same"><kbd>S</kbd> Same</button><button class="response" data-response="different"><kbd>D</kbd> Different</button></div>
</section>
<section id="done" class="hidden center"><h1>Task complete</h1><p id="summary"></p><div class="row" style="justify-content:center"><button id="download" class="primary">Download CSV</button><button id="restart">Restart</button></div></section>
</main>
<script>
'use strict';

const TOTAL = 60;
const TRIAL_MS = 3000;
const TOTAL_MS = TOTAL * TRIAL_MS;
const AUDIO_GAP_MS = 750;
const $ = id => document.getElementById(id);

let audioContext = null;
let audioBuffers = {};
let trials = [];
let results = [];
let trialIndex = -1;
let taskStart = 0;
let trialTimer = null;
let finishTimer = null;
let responded = false;
let activeSources = [];
let taskToken = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function buildTrials() {
  const same = [];
  for (let level = 1; level <= 7; level++) {
    for (let n = 0; n < 4; n++) same.push({a: level, b: level, condition: 'same'});
  }
  const different = [];
  for (const [a, b] of [[1,4],[4,1],[2,5],[5,2],[3,6],[6,3],[4,7],[7,4]]) {
    for (let n = 0; n < 4; n++) different.push({a, b, condition: 'different'});
  }
  return shuffle(same.concat(different));
}

async function preload() {
  try {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) throw new Error('Web Audio is not supported by this browser.');
    audioContext = new AudioCtor();
    for (let level = 1; level <= 7; level++) {
      const url = `stimuli/step${level}.wav`;
      const response = await fetch(url, {cache: 'no-cache'});
      if (!response.ok) throw new Error(`${url} (${response.status})`);
      const bytes = await response.arrayBuffer();
      audioBuffers[level] = await audioContext.decodeAudioData(bytes);
    }
    $('loadStatus').textContent = 'All 7 audio stimuli are ready.';
    $('start').disabled = false;
  } catch (error) {
    $('loadStatus').innerHTML = `<span class="warning">Audio unavailable: ${error.message}</span><br>Place the <code>stimuli</code> folder beside this HTML file.`;
  }
}

function stopActiveSources() {
  for (const source of activeSources) {
    try { source.onended = null; source.stop(0); } catch (_) {}
    try { source.disconnect(); } catch (_) {}
  }
  activeSources = [];
}

function playPair(trial) {
  stopActiveSources();
  const first = audioContext.createBufferSource();
  const second = audioContext.createBufferSource();
  first.buffer = audioBuffers[trial.a];
  second.buffer = audioBuffers[trial.b];
  first.connect(audioContext.destination);
  second.connect(audioContext.destination);
  activeSources = [first, second];
  const startAt = audioContext.currentTime + 0.05;
  first.start(startAt);
  second.start(startAt + AUDIO_GAP_MS / 1000);
}

function record(response, timeout = false) {
  if (responded || trialIndex < 0 || trialIndex >= TOTAL) return;
  responded = true;
  const trial = trials[trialIndex];
  const rt = performance.now() - (taskStart + trialIndex * TRIAL_MS);
  const correct = !timeout && ((response === 'same') === (trial.condition === 'same'));
  results.push({
    participant: $('participant').value.trim(),
    trial: trialIndex + 1,
    first_level: trial.a,
    second_level: trial.b,
    condition: trial.condition,
    response: response || '',
    correct,
    timeout,
    rt_ms: timeout ? '' : Math.round(rt),
    trial_start_ms: trialIndex * TRIAL_MS
  });
  $('taskStatus').textContent = timeout ? 'No response — scored incorrect.' : `${response === 'same' ? 'Same' : 'Different'} response recorded.`;
  updateAccuracy();
}

function updateAccuracy() {
  if (!results.length) { $('accuracy').textContent = '—'; return; }
  const correct = results.filter(item => item.correct).length;
  $('accuracy').textContent = `${Math.round(100 * correct / results.length)}%`;
}

function beginTrial(index, token) {
  if (token !== taskToken || index >= TOTAL) return;
  trialIndex = index;
  responded = false;
  const trial = trials[index];
  $('trialNo').textContent = index + 1;
  $('taskStatus').textContent = 'Respond within 3 seconds.';
  $('bar').style.width = `${(index / TOTAL) * 100}%`;
  playPair(trial);

  clearTimeout(trialTimer);
  trialTimer = setTimeout(() => {
    if (token !== taskToken) return;
    if (!responded) record('', true);
    if (index + 1 < TOTAL) beginTrial(index + 1, token);
  }, TRIAL_MS);
}

function finish() {
  clearTimeout(trialTimer);
  stopActiveSources();
  $('bar').style.width = '100%';
  $('task').classList.add('hidden');
  $('done').classList.remove('hidden');
  const correct = results.filter(item => item.correct).length;
  $('summary').textContent = `Completed ${TOTAL} trials in exactly 3 minutes. Accuracy: ${correct}/${TOTAL} (${Math.round(100 * correct / TOTAL)}%).`;
}

async function startTask() {
  if (!$('participant').value.trim()) { alert('Enter a participant ID.'); return; }
  await audioContext.resume();
  clearTimeout(trialTimer);
  clearTimeout(finishTimer);
  stopActiveSources();
  taskToken++;
  const token = taskToken;
  trials = buildTrials();
  results = [];
  trialIndex = -1;
  responded = false;
  $('setup').classList.add('hidden');
  $('done').classList.add('hidden');
  $('task').classList.remove('hidden');
  taskStart = performance.now();
  beginTrial(0, token);
  finishTimer = setTimeout(() => { if (token === taskToken) finish(); }, TOTAL_MS);
}

function makeCsv() {
  const columns = ['participant','trial','first_level','second_level','condition','response','correct','timeout','rt_ms','trial_start_ms'];
  const rows = results.slice().sort((a,b) => a.trial - b.trial).map(row => columns.map(column => `"${String(row[column] ?? '').replaceAll('"','""')}"`).join(','));
  return [columns.join(','), ...rows].join('\n');
}

preload();
$('start').addEventListener('click', startTask);
document.querySelectorAll('[data-response]').forEach(button => button.addEventListener('click', () => record(button.dataset.response)));
document.addEventListener('keydown', event => {
  if ($('task').classList.contains('hidden') || event.repeat) return;
  const key = event.key.toLowerCase();
  if (key === 's' || key === 'd') { event.preventDefault(); record(key === 's' ? 'same' : 'different'); }
});
$('download').addEventListener('click', () => {
  const blob = new Blob([makeCsv()], {type: 'text/csv'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `phoneme_discrimination_${$('participant').value.trim() || 'participant'}.csv`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
});
$('restart').addEventListener('click', () => location.reload());
</script>
</body>
</html>
